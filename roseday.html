<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Rose Day! 🌹</title>
  <style>
    body { margin: 0; overflow: hidden; height: 100vh; background: linear-gradient(to bottom, #ffe0e0, #ffb6c1); font-family: Arial, sans-serif; }
    h1 {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      margin: 0; color: #d10024; font-size: 5rem; font-family: "Brush Script MT", cursive;
      text-shadow: 2px 2px 6px rgba(255,255,255,0.9);
      z-index: 10; pointer-events: none; white-space: nowrap;
    }
    canvas { position: fixed; inset: 0; z-index: 1; }
    .petal {
      position: absolute; width: 15px; height: 15px; top: -20px;
      border-radius: 150% 0 150% 0; opacity: 0.85; z-index: 2;
      pointer-events: none; box-shadow: 1px 1px 5px rgba(0,0,0,0.2);
    }
    @keyframes fall {
      0% { top: -50px; opacity: 0; transform: translateX(0) rotate(0deg); }
      10% { opacity: 1; }
      100% { top: 110vh; opacity: 0.7; transform: translateX(20px) rotate(360deg); }
    }
    #err {
      position: fixed; left: 16px; bottom: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 12px 14px;
      border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      z-index: 9999; display: none; white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Happy Rose Day! 🌹</h1>
  <div id="err"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    const errBox = document.getElementById("err");
    const showErr = (msg) => { 
      errBox.style.display = "block"; 
      errBox.textContent = msg; 
      console.error(msg); 
    };

    // 1) Petals Animation
    function createPetal() {
      const petal = document.createElement("div");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "vw";
      const duration = Math.random() * 5 + 3;
      petal.style.animation = `fall ${duration}s linear infinite`;
      const size = Math.random() * 10 + 10;
      petal.style.width = `${size}px`;
      petal.style.height = `${size}px`;
      const colors = ["#ff0040", "#ff4d4d", "#e60023", "#ff80a0", "#ff9999"];
      petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), duration * 1000);
    }
    setInterval(createPetal, 300);

    // 2) Import Three.js modules
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';

    // 3) Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3.2);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    // 4) Load Model
    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
    loader.setDRACOLoader(draco);

    let rose = null;

    loader.load(
      "./rose.glb", 
      (gltf) => {
        rose = gltf.scene;
        rose.scale.set(3, 3, 3);
        rose.position.set(0,0.5, 0);
        scene.add(rose);
      },
      undefined,
      (e) => showErr("Failed to load ./rose.glb\n\nCheck if rose.glb is in the same folder and you are using a local server.")
    );

    // 5) Interactivity & Animation
    const mouse = { x: 0, y: 0 };
    const smooth = { x: 0, y: 0 };

    window.addEventListener("mousemove", (ev) => {
      mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
    requestAnimationFrame(animate);

    // Smooth mouse movement for a high-quality feel
    smooth.x += (mouse.x - smooth.x) * 0.08;
    smooth.y += (mouse.y - smooth.y) * 0.08;

    if (rose) {
        // 1. POSITION: Stay in the center (0.5), sway slightly with mouse
        rose.position.x = smooth.x * 0.4;
        rose.position.y = 0.5 + (smooth.y * 0.2); 

        // 2. ROTATION: Interact only. No automatic spinning.
        // X handles the vertical tilt (up/down)
        // Y handles the horizontal turn (left/right)
        rose.rotation.x = -smooth.y * 0.4; 
        rose.rotation.y = smooth.x * 0.8; 
        
        // 3. LOCK Z: Keeps the stem from rolling sideways
        rose.rotation.z = 0; 
    }

    renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
